<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="文献雷达" />
<meta name="description" content="蛋白设计每日文献雷达：bioRxiv 预印本 + Nature / Science / Cell / Nature Methods / Nature Biotechnology 新刊" />
<title>文献雷达 · 蛋白设计</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="./icons/favicon-32.png" alt="" width="22" height="22" />
      <span class="brand-name">文献雷达</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-search" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-refresh" aria-label="刷新">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="searchrow" id="searchrow" hidden>
    <input id="search" type="search" placeholder="搜索标题 / 作者 / 期刊" autocomplete="off" />
  </div>

  <div class="subbar" id="subbar"></div>

  <main id="content" class="content" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="biorxiv">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.5 18a2 2 0 0 0 1.7 3h9.6a2 2 0 0 0 1.7-3L14 9.5V3"/><path d="M7.2 14h9.6"/></svg>
      <span>bioRxiv</span>
    </button>
    <button class="tab" data-tab="journals">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 18.5V5.5"/><path d="M8 7h7M8 11h7"/></svg>
      <span>五大刊</span>
    </button>
    <button class="tab" data-tab="stars">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>
      <span>收藏</span>
    </button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
